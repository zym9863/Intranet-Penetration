name: Deploy Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server with SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"

            fetch_with_retry() {
              local retries=5
              local delay=5
              local attempt=1

              while [ "$attempt" -le "$retries" ]; do
                echo "[deploy] git fetch attempt ${attempt}/${retries}"
                if git -c http.version=HTTP/1.1 fetch --all --prune; then
                  return 0
                fi

                if [ "$attempt" -lt "$retries" ]; then
                  echo "[deploy] git fetch failed, retrying in ${delay}s..."
                  sleep "$delay"
                fi

                attempt=$((attempt + 1))
              done

              echo "[deploy] git fetch failed after ${retries} attempts"
              return 1
            }

            fetch_with_retry
            git checkout main
            git reset --hard origin/main
            docker compose up -d --build chuan-server
            docker image prune -f
